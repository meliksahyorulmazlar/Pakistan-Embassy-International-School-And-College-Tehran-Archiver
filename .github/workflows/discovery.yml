name: Link Discovery

on:
  schedule:
    # Once daily at 05:15 UTC
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: link-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 235

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Discover website links
        run: python -u links.py

      - name: Commit and push updated links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add links.txt

          if git diff --cached --quiet; then
            echo "No changes to links.txt"
          else
            git commit -m "Update website links"
            git pull --rebase
            git push
          fi
